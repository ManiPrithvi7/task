name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          # Align with package.json engines.bun (>=1.3.0)
          bun-version: "1.3.12"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Validate production-shaped env fixture
        run: |
          set -a
          # shellcheck disable=SC1091
          source tests/fixtures/prod-env.env
          set +a
          bun scripts/validate-env.ts --production
      # Stabilize-before-require: e2e is required once green; continue-on-error removed after local green.
      - run: bun run test:e2e
